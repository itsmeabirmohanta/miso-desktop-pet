name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          BUTLER_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.BUTLER_PUBLIC_GOOGLE_CLIENT_ID }}
          BUTLER_PUBLIC_GOOGLE_CLIENT_SECRET: ${{ secrets.BUTLER_PUBLIC_GOOGLE_CLIENT_SECRET }}
      - run: npm run smoke:packaged
      - run: node scripts/verify-packaged.mjs --safe-mode
      - name: Require default Google sign-in in publisher builds
        if: github.event_name != 'pull_request'
        run: node scripts/audit-release.mjs --packaged --require-oauth
      - uses: actions/upload-artifact@v4
        with:
          name: MISO-Windows-x64${{ github.event_name == 'pull_request' && '-test-build' || '' }}
          path: |
            release/MISO Setup *.exe
            release/MISO Setup *.exe.sha256
          if-no-files-found: error
